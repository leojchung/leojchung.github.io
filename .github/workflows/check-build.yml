name: Check build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node build.js
      - run: git diff --exit-code index.html projects.html fun.html contact.html sitemap.xml
