<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('ljc-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="theme-color" content="#F7F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101120" media="(prefers-color-scheme: dark)">
<title>Not found — Leo J. Chung</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .oops{display:grid;place-items:center;min-height:72vh}
  .oops .shell{text-align:left;width:100%}
  .code{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:700;
  }
  .oops h1{
    margin:16px 0 0;font-weight:400;font-size:clamp(34px,5.5vw,58px);
    line-height:1.03;letter-spacing:-.028em;text-wrap:balance;max-width:18ch;
  }
  .oops h1 em{font-style:italic;color:var(--accent)}
  .oops p{margin:20px 0 0;color:var(--ink-2);max-width:52ch;font-size:17.5px}
  .oops .back{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="oops">
  <div class="shell">
    <div class="code">Error 404</div>
    <h1>This page does not <em>exist.</em></h1>
    <p>Which is a shame, because the address looked plausible. Nothing here has been deleted — the link was probably just wrong.</p>
    <div class="back">
      <a class="btn solid" href="/">Back to the start</a>
      <a class="btn" href="/contact.html">Tell me what broke</a>
    </div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
